services:
  # ==========================================
  # 1. Backend Web Service (FastAPI)
  # ==========================================
  - type: web
    name: edumentor-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PROJECT_NAME
        value: "EduMentor AI — Adaptive AI Teacher"
      - key: VERSION
        value: "1.0.0"
      - key: API_V1_STR
        value: "/api"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DATABASE_URL
        value: "sqlite:///./edumentor.db"
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: "edumentor_db"
      - key: LLM_PROVIDER
        value: "groq"
      - key: LLM_MODEL
        value: "openai/gpt-oss-120b"
      - key: LLM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JUDGE0_API_URL
        value: "http://localhost:2358"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: "local"
      - key: EMBEDDING_MODEL
        value: "BAAI/bge-m3"
      - key: EMBEDDING_DIM
        value: "384"
      - key: STT_PROVIDER
        value: "webspeech"
      - key: TTS_PROVIDER
        value: "webspeech"
      - key: AVATAR_PROVIDER
        value: "canvas"
      - key: VIDEO_ENGINE
        value: "d_id"
      - key: D_ID_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        value: ""
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: VIDEO_FPS
        value: "12"
      - key: VIDEO_MAX_SCENES
        value: "5"
      - key: UPLOAD_DIR
        value: "./storage/uploads"
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"

  # ==========================================
  # 2. Frontend Static Site (React + Vite)
  # ==========================================
  - type: web
    name: edumentor-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
